<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">Registration Form</h1>

        <form id="registrationForm" novalidate>
        	<div class="row mb-3">

	    <div class="col-md-6">
	        <label for="firstName" class="form-label">
	            First Name
	        </label>

	        <input
	            type="text"
	            class="form-control"
	            id="firstName"
	            required
	        >

	        <div class="valid-feedback">
	            looks good
	        </div>

	        <div class="invalid-feedback">
	            First name is required
	        </div>
	    </div>

	    <div class="col-md-6">
	        <label for="lastName" class="form-label">
	            Last Name
	        </label>

	        <input
	            type="text"
	            class="form-control"
	            id="lastName"
	            required
        	>

        	<div class="valid-feedback">
            	looks good
        	</div>

        	<div class="invalid-feedback">
            	Last name is required
        	</div>
    	</div>
	</div>

	<div class="mb-3">

	    <label for="email" class="form-label">
	        Email
	    </label>

	    <input
	        type="email"
	        class="form-control"
	        id="email"
	        placeholder="example@gmail.com"
	        required
	    >

	    <div class="valid-feedback">
	        looks good
	    </div>

	    <div class="invalid-feedback">
	        Please enter a valid email
	    </div>
	</div>

	<div class="row mb-3">

    <div class="col-md-6">

        <label for="password" class="form-label">
            Password
        </label>

        <input
            type="password"
            class="form-control"
            id="password"
            minlength="8"
            required
        >

        <div class="valid-feedback">
            looks good
        </div>

        <div class="invalid-feedback">
            Password must contain at least 8 characters
        </div>

    </div>

    <div class="col-md-6">

        <label for="confirmPassword" class="form-label">
            Confirm Password
        </label>

        <input
            type="password"
            class="form-control"
            id="confirmPassword"
            required
        >

        <div class="valid-feedback">
            passwords match
        </div>

        <div class="invalid-feedback">
            Passwords do not match
        </div>

    </div>

</div>
		
		<div class="mb-3">

    <label class="form-label">Gender</label>

    <div class="form-check">

        <input
            class="form-check-input"
            type="radio"
            name="gender"
            id="male"
            value="male"
            required
        >

        <label class="form-check-label" for="male">
            Male
        </label>

    </div>

    <div class="form-check">

        <input
            class="form-check-input"
            type="radio"
            name="gender"
            id="female"
            value="female"
        >

        <label class="form-check-label" for="female">
            Female
        </label>

    </div>

    <div id="genderFeedback" class="text-danger small d-none">
        please select your gender
    </div>

</div>	
	
		<div class="mb-3">

    <label class="form-label">Hobbies</label>

    <div class="form-check">

        <input
            class="form-check-input"
            type="checkbox"
            id="gaming"
            value="gaming"
        >

        <label class="form-check-label" for="gaming">
            Gaming
        </label>

    </div>

    <div class="form-check">

        <input
            class="form-check-input"
            type="checkbox"
            id="sports"
            value="sports"
        >

        <label class="form-check-label" for="sports">
            Sports
        </label>

    </div>

    <div class="form-check">

        <input
            class="form-check-input"
            type="checkbox"
            id="music"
            value="music"
        >

        <label class="form-check-label" for="music">
            Music
        </label>

    </div>

</div>

        </form>

    </div>

</body>
</html>
